version: "2"
sql:
  - schema: "internal/db/migrations"
    queries: "internal/db/sql/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
