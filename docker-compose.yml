services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: internly-db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - .env
    ports:
      - "5432:5432" # Comment out in production
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql # Enables pgvector extension

volumes:
  pgdata:
